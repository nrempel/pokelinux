[package]
name = "pokelinux-pstore-witness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rustix = { version = "=1.1.5", features = ["fs", "mount", "process", "rand", "system", "time"] }

[[bin]]
name = "pokelinux-pstore-witness"
path = "src/main.rs"

[profile.release]
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
