[package]
name = "native-messages-incoming-binder-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rsbinder = { version = "=0.12.0", default-features = false }
serde_json = "=1.0.154"
pokelinux-messages = {path="../../../native-messages",features=["isolated-fixture"]}
pokelinux-lifecycle = {path="../../../native-lifecycle"}
pokelinux-messaging = {path="../../../native-messaging"}
rustix = {version="=1.1.5",features=["process","net"]}

[build-dependencies]
rsbinder-aidl = { version = "=0.12.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
