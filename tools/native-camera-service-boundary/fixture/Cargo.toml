[package]
name = "native-camera-service-boundary-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pokelinux-camera = { path = "../../../native-camera" }
pokelinux-camera-service = { path = "../../../native-camera-service" }
pokelinux-lifecycle = { path = "../../../native-lifecycle" }
rsbinder = { version = "=0.12.0", default-features = false }
rustix = { version = "=1.1.5", features = ["event", "net", "pipe", "process"] }
serde_json = "=1.0.154"

[build-dependencies]
rsbinder-aidl = { version = "=0.12.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
