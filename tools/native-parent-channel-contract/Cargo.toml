[package]
name = "pokelinux-parent-channel-contract"
version = "0.1.0"
edition = "2024"
publish = false

[features]
retained-channel = []

[dependencies]
pokelinux-process-owner = { path = "../../native-process-owner" }
rustix = { version = "=1.1.5", features = ["net", "time", "process", "fs", "event", "stdio"] }

[[bin]]
name = "parent-channel-current-control"
path = "src/current_control.rs"

[[bin]]
name = "parent-channel-consumer"
path = "src/consumer.rs"
required-features = ["retained-channel"]

[lints.rust]
unsafe_code = "forbid"
