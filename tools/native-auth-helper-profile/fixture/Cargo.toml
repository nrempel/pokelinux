[package]
name = "pokelinux-auth-helper-profile-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[features]
contained = []

[[bin]]
name = "helper-profile-launcher"
path = "src/launcher.rs"

[[bin]]
name = "helper-profile-probe"
path = "src/probe.rs"

[dependencies]
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["fs", "process", "thread"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
