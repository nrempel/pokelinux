[package]
name = "pokelinux-messaging"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sms-pdu = "=1.1.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

time = { version = "=0.3.55", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
