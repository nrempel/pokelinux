[package]
name = "pokelinux-audio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.5", features = ["net", "process", "fs"] }

pokelinux-power = { path = "../native-power" }
pokelinux-kernel-identity = { path = "../native-kernel-identity" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
rustix = { version = "=1.1.5", features = ["event"] }
