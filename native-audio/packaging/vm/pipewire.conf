# Explicit virtual graph for disposable VM integration; no hardware discovery.
context.properties = {
  core.daemon = true core.name = pokelinux-audio-test
  default.clock.rate = 48000 default.clock.quantum = 256
}
context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  audiotestsrc = audiotestsrc/libspa-audiotestsrc
  support.* = support/libspa-support
}
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-link-factory }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-access args = { access.socket = { pokelinux-audio-test = "unrestricted" pokelinux-audio-test-manager = "unrestricted" } } }
]
context.objects = [
  { factory = spa-node-factory args = {
    factory.name = support.node.driver node.name = Test-Driver priority.driver = 20000
  } }
  { factory = adapter args = {
    factory.name = "audiotestsrc" node.name = "source.media" media.class = "Audio/Source"
    audio.format = F32 audio.rate = 48000 audio.channels = 1 audio.position = [ MONO ]
    adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    node.param.PortConfig = { direction = Output mode = dsp format = { mediaType = audio mediaSubtype = raw format = F32 rate = 48000 channels = 1 position = [ MONO ] } }
    node.param.Props = { waveType = 0 volume = 0.25 }
  } }
  { factory = adapter args = {
    factory.name = "audiotestsrc" node.name = "source.microphone" media.class = "Audio/Source"
    audio.format = F32 audio.rate = 48000 audio.channels = 1 audio.position = [ MONO ]
    adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    node.param.PortConfig = { direction = Output mode = dsp format = { mediaType = audio mediaSubtype = raw format = F32 rate = 48000 channels = 1 position = [ MONO ] } }
    node.param.Props = { waveType = 0 volume = 0.25 }
  } }
  { factory = adapter args = {
    factory.name = "support.null-audio-sink" node.name = "route.speaker" media.class = "Audio/Sink"
    audio.format = F32 audio.rate = 48000 audio.channels = 1 audio.position = [ MONO ]
    adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    priority.driver = 100
  } }
  { factory = adapter args = {
    factory.name = "support.null-audio-sink" node.name = "route.earpiece" media.class = "Audio/Sink"
    audio.format = F32 audio.rate = 48000 audio.channels = 1 audio.position = [ MONO ]
    adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    priority.driver = 100
  } }
  { factory = adapter args = {
    factory.name = "support.null-audio-sink" node.name = "route.capture" media.class = "Audio/Sink"
    audio.format = F32 audio.rate = 48000 audio.channels = 1 audio.position = [ MONO ]
    adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    priority.driver = 100
  } }
]
