[package]
name="pokelinux-sensors-boundary"
version="0.1.0"
edition="2024"
publish=false
[dependencies]
pokelinux-sensors={path="../native-sensors"}
rsbinder={version="=0.12.0",default-features=false}
pokelinux-suspend={path="../native-suspend"}
pokelinux-suspend-boundary={path="../native-suspend-boundary"}

libc={version="=0.2.190",optional=true}

[features]
wake-fault-test=["dep:libc"]

[[bin]]
name="sensor-wake-client"
path="src/bin/sensor-wake-client.rs"
required-features=["wake-fault-test"]

[build-dependencies]
rsbinder-aidl={version="=0.12.0",default-features=false}
[lints.rust]
unsafe_code="deny"
