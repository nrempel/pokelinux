[package]
name = "pokelinux-kernel-identity"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["fs", "event"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
rustix = { version = "=1.1.5", features = ["net", "event", "process"] }

[[test]]
name = "termination_control"
path = "tests/termination_control.rs"
harness = false
