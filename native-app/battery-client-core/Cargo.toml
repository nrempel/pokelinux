[package]
name = "pokelinux-battery-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pokelinux_battery_client"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
