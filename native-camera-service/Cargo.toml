[package]
name = "pokelinux-camera-service"
version = "0.1.0"
edition = "2024"
publish = false
description = "Owned native camera backend process through one current lifecycle authority"

[dependencies]
pokelinux-camera = { path = "../native-camera" }
pokelinux-lifecycle = { path = "../native-lifecycle" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "process", "thread"] }

[lints.rust]
unsafe_code = "forbid"
