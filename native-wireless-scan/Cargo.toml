[package]
name = "pokelinux-wireless-scan"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pokelinux-wireless-scan"
path = "src/main.rs"

[dependencies]
netlink-sys = { version = "=0.9.0", default-features = false }
rustix = { version = "=1.1.5", features = ["net", "time", "event"] }

[lints.rust]
unsafe_code = "forbid"
