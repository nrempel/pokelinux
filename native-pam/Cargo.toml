[package]
name = "pokelinux-pam"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Isolated integration fixture; the production binary still has one fixed policy.
ownership-fixture = []

[[bin]]
name = "pam-ownership-fixture"
path = "src/bin/pam-ownership-fixture.rs"
required-features = ["ownership-fixture"]

[dependencies]
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["time", "thread"] }
zeroize = "=1.9.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
