[package]
name = "pokelinux-lifecycle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pokelinux-brightness = { path = "../native-brightness" }
pokelinux-audio = { path = "../native-audio" }
pokelinux-kernel-identity = { path = "../native-kernel-identity" }
pokelinux-camera = { path = "../native-camera" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.5", features = ["net", "process", "thread", "fs", "event", "time", "rand"] }

sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
native-session-authority-fixture = { path = "../tools/native-session-authority/fixture" }
