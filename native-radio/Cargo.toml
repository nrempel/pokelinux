[package]
name = "pokelinux-radio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pokelinux-process-owner = { path = "../native-process-owner" }
pokelinux-phone-state = { path = "../native-phone-state" }
pokelinux-kernel-identity = { path = "../native-kernel-identity" }
omarchy-ims = { path = "../native-ims" }
rustix = { version = "=1.1.5", features = ["time", "fs", "process", "net", "event", "thread", "stdio", "termios"] }
rsbinder = { version = "=0.12.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
rsbinder-aidl = { version = "=0.12.0", default-features = false }
