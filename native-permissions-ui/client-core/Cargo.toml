[package]
name = "pokelinux-permissions-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pokelinux_permissions_client"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["net", "event", "time", "process", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[[test]]
name = "client-boundary"
path = "tests/client-boundary.rs"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
