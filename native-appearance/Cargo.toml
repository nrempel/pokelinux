[package]
name = "pokelinux-appearance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["net", "event", "process", "fs", "thread", "time", "rand"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
