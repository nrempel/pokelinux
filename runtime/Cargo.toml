[package]
name = "omarchy-phone-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rustix = { version = "1", features = ["fs", "process", "time", "net", "event"] }

rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = "0.4"
zbus = "5.19"
async-io = "2.6"
async-channel = "2.5"
futures-lite = "2.6"
ordered-stream = "0.2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

