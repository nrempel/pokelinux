[package]
name = "pokelinux-brightness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rustix = { version = "=1.1.5", features = ["fs", "net", "process", "time", "pipe", "event", "stdio"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
pokelinux-kernel-identity = { path = "../native-kernel-identity" }

[[test]]
name = "worker"
path = "tests/worker.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"
